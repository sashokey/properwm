name: Hold pending WoW release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/hold-wow-release.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const run_id = 43084897308;
            const { data } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
            if (data.head_sha !== '11a120255a906897544c27ea90828d9e8409a350') {
              throw new Error('Unexpected release revision');
            }
            if (data.status !== 'completed') {
              await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id });
            }
