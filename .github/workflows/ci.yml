name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select newest Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Check localization
        run: python3 Scripts/check_localization.py

      - name: Check debug switches
        run: python3 Scripts/check_debug_switches.py

      - name: Build and run unit tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project ProperWM.xcodeproj \
            -scheme ProperWM \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage YES \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-test.log

      - name: Check deployment compatibility
        if: (success() || failure()) && steps.tests.outcome != 'skipped'
        run: python3 Scripts/check_availability_warnings.py build/xcodebuild-test.log

      - name: Export coverage
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build/TestResults.xcresult ] && xcrun xccov view --report build/TestResults.xcresult > build/coverage.txt; then
            xcrun xccov view --report --json build/TestResults.xcresult > build/coverage.json
            cat build/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage is unavailable because test execution did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build universal package
        if: success()
        env:
          PROPERWM_VERSION: ${{ inputs.version || '0.1.0' }}
        run: bash Scripts/package_release.sh

      - name: Check release deployment compatibility
        if: success()
        run: python3 Scripts/check_availability_warnings.py build/xcodebuild-release.log

      - name: Upload ProperWM
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ProperWM
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results
          path: |
            build/xcodebuild-test.log
            build/xcodebuild-release.log
            build/TestResults.xcresult
            build/coverage.txt
            build/coverage.json
          if-no-files-found: warn
          retention-days: 14
